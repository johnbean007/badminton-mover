[project]
name = "badminton-mover-worker"
version = "0.1.0"
description = "GPU worker: pose and shuttle tracking for Badminton Mover, run on Modal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.0",
]

[dependency-groups]
# Also installed in the Modal image (see app.py), so the pipeline can be run and tested locally.
pipeline = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.6",
]
# The near-side check's person detector (heavier; only needed to run sidecheck locally).
detect = [
    "rtmlib",
    "onnxruntime",
]
# Pose and shuttle tracking (only needed to run the analysis locally, see local_analyse.py).
analyse = [
    "rtmlib",
    "onnxruntime",
    "torch>=2.6",
    "pillow",
]

[tool.uv]
default-groups = ["pipeline"]
